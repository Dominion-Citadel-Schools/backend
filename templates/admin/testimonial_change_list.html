{% extends "admin/change_list.html" %}

{% block content %}

<div style="display:flex;gap:20px;margin-bottom:20px">

    <div class="card" style="padding:10px;background:#ffc107;color:white;border-radius:6px;">
        Pending: {{ pending_count }}
    </div>

    <div class="card" style="padding:10px;background:#28a745;color:white;border-radius:6px;">
        Approved: {{ approved_count }}
    </div>

    <div class="card" style="padding:10px;background:#dc3545;color:white;border-radius:6px;">
        Rejected: {{ rejected_count }}
    </div>

</div>

{{ block.super }}

{% endblock %}
