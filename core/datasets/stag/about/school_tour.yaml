    - section_type: "school_tour"

      title: "Majek Campus Main Academic Building"
      description: >
        The Majek Campus Main Academic Building houses the crèche, primary, and junior secondary school facilities. Each building is equipped with modern classrooms, science laboratories (for the junior secondary school), and administrative offices—creating a vibrant and supportive learning environment for students from early childhood through junior secondary level.

