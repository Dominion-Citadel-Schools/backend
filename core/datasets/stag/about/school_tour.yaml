      title: "Oribanwa Campus Main Academic Building"
      description: >
        The Oribanwa Campus Main Academic Building brings together crèche, primary, and secondary school facilities in one vibrant learning environment. Each section features modern classrooms, well-equipped science laboratories for the secondary school, and dedicated administrative offices—designed to support excellence in education from early years through advanced studies.

